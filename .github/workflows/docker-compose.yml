version: '3.8'

services:
  whatsapp-bot:
    build: .
    container_name: wa-bot-247
    restart: unless-stopped
    volumes:
      - ./session:/app/session
      - ./data:/app/data
      - ./logs:/app/logs
      - ./dashboard:/app/dashboard
    environment:
      - WORKER_URL=${WORKER_URL}
      - API_SECRET=${API_SECRET}
