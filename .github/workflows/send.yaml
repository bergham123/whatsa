name: WhatsApp Automation

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
  
permissions:
  contents: write

jobs:
  run:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm install
        shell: bash

      - name: Run WhatsApp bot
        shell: bash
        run: |
          n=0
          until [ "$n" -ge 3 ]
          do
            npm start && break
            n=$((n+1))
            echo "⚠️ حدث خطأ أثناء التشغيل، إعادة المحاولة $n/3..."
            sleep 10
          done

      - name: Clean up unnecessary session files
        shell: bash
        run: |
          echo "🧹 جاري تنظيف ملفات الكاش المؤقتة لتوفير المساحة..."
          find ./session -type d -name "Cache" -exec rm -rf {} + 2>/dev/null || true
          find ./session -type d -name "Code Cache" -exec rm -rf {} + 2>/dev/null || true
          find ./session -type d -name "GPUCache" -exec rm -rf {} + 2>/dev/null || true
          find ./session -type d -name "DawnGraphiteCache" -exec rm -rf {} + 2>/dev/null || true
          find ./session -type d -name "DawnWebGPUCache" -exec rm -rf {} + 2>/dev/null || true
          find ./session -type d -name "GraphiteDawnCache" -exec rm -rf {} + 2>/dev/null || true
          find ./session -type d -name "GPUPersistentCache" -exec rm -rf {} + 2>/dev/null || true
          find ./session -type d -name "CacheStorage" -exec rm -rf {} + 2>/dev/null || true
          find ./session -type d -name "ScriptCache" -exec rm -rf {} + 2>/dev/null || true
          find ./session -type d -name "Sessions" -exec rm -rf {} + 2>/dev/null || true
          find ./session -type d -name "Shared Dictionary" -exec rm -rf {} + 2>/dev/null || true
          
          rm -f ./session/session-main/DevToolsActivePort 2>/dev/null || true
          rm -f ./session/session-main/SingletonLock 2>/dev/null || true
          rm -f ./session/session-main/SingletonCookie 2>/dev/null || true
          rm -f ./session/session-main/SingletonSocket 2>/dev/null || true
          
          echo "✅ تم التنظيف بنجاح!"

      - name: Commit updated files
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git rm -r --cached session --ignore-unmatch
          git add --ignore-errors session dashboard aggregate.json logs
          git commit -m "update session, dashboard & logs $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git push
